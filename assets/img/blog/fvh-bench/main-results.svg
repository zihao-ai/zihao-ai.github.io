<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">The main generation results</title><desc id="desc">Across 11 generators: mean refusal rate 2.45%, mean target harm realization 4.46 out of 5, and four models with mean harmful artifact usability above four.</desc>
<rect width="1000" height="800" fill="#fdfcfa"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#166a6f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="45" y="65" fill="#19383c" font-size="38" font-weight="700" text-anchor="start">The main generation results</text>
<text x="45" y="108" fill="#53686c" font-size="25" font-weight="400" text-anchor="start">669 prompts · 11 image generators</text>
<rect x="45" y="155" width="910" height="145" rx="14" fill="#eff5f3" stroke="#c9dad6"/>
<text x="70" y="215" fill="#166a6f" font-size="44" font-weight="700" text-anchor="start">2.45%</text>
<text x="330" y="209" fill="#19383c" font-size="28" font-weight="700" text-anchor="start">Refusal rate</text>
<text x="70" y="267" fill="#19383c" font-size="23" font-weight="400" text-anchor="start">Average refusal rate across the 11 evaluated generators.</text>
<rect x="45" y="340" width="910" height="145" rx="14" fill="#eff5f3" stroke="#c9dad6"/>
<text x="70" y="400" fill="#166a6f" font-size="44" font-weight="700" text-anchor="start">4.46 / 5</text>
<text x="330" y="394" fill="#19383c" font-size="28" font-weight="700" text-anchor="start">Target harm realization</text>
<text x="70" y="452" fill="#19383c" font-size="23" font-weight="400" text-anchor="start">Mean THR across generators; scores apply to generated images.</text>
<rect x="45" y="525" width="910" height="145" rx="14" fill="#eff5f3" stroke="#c9dad6"/>
<text x="70" y="585" fill="#166a6f" font-size="44" font-weight="700" text-anchor="start">4 of 11</text>
<text x="330" y="579" fill="#19383c" font-size="28" font-weight="700" text-anchor="start">High artifact usability</text>
<text x="70" y="637" fill="#19383c" font-size="23" font-weight="400" text-anchor="start">Models with mean harmful artifact usability (HAU) above 4.</text>
<text x="45" y="725" fill="#53686c" font-size="23" font-weight="400" text-anchor="start">THR and HAU use 1–5 ratings, not real-world harm probabilities.</text>
<text x="45" y="775" fill="#53686c" font-size="20" font-weight="400" text-anchor="start">Source: §4.2 and Table 1 · headline results</text>
</g></svg>

- title: Research Experience
  type: time_table
  contents:
    - title: Research Collaboration
      institution: Huawei 2012 Lab (University-Industry Collaboration), Shenzhen, China
      year: Dec. 2024 - Present
      description:
        - 'Investigated the "unthinking vulnerability" in reasoning models. Proposed the Breaking of Thought (BoT) attack and designed the Monitoring of Thought (MoT) framework to dynamically terminate redundant or risky reasoning.'
        - "Proposed Adversarial Chain-of-Thought Tuning (AdvChain) to address the snowball effect in safety alignment of reasoning models, improving robustness against jailbreak attacks and CoT hijacking."
    - title: Research Intern
      institution: Tencent AI Lab, Shenzhen, China
      year: Mar. 2024 - Jul. 2024
      description:
        - "Led the design of EARBench, the first physical risk awareness evaluation benchmark for embodied AI. Built EARDataset using multi-agent collaboration to generate risk scenarios for task planning safety evaluation."

